services:
  poc-rfc:
    build:
      context: .
      args:
        # Cambiar a 17 para repetir la prueba sobre otra versión de Java.
        JDK: ${JDK:-21}
    image: poc-rfc-jco:jdk${JDK:-21}
    container_name: poc-rfc-jco

    # Credenciales y datos del sistema SAP. El .env no se versiona.
    # ENV_FILE=.env.dev docker compose up   para apuntar a DEV (DS4).
    env_file:
      - ${ENV_FILE:-.env}

    # Escritura ABAP por /api/abap/006/aplicar: apagada salvo que se arranque
    # con ABAP_ESCRITURA=true en la línea de comandos. Va aquí y no en el .env
    # para que encenderla sea siempre un acto explícito.
    environment:
      ABAP_ESCRITURA: ${ABAP_ESCRITURA:-false}

    # Carpeta abap/ del repo: /api/abap lee actual/ y propuesto/ y deja la
    # copia de lo activo en SAP en activo/.
    volumes:
      - ./abap:/app/abap

    ports:
      - "${PORT:-8080}:8080"

    # --- Red -------------------------------------------------------------
    # Con el bridge por defecto, el tráfico del contenedor sale por la tabla
    # de rutas del host, así que hereda la VPN. Si el túnel usa policy routing
    # y el contenedor no alcanza al SAP, comentar 'ports' y descomentar esto:
    #
    # network_mode: host
    #
    # Y si el host del SAP no resuelve por DNS dentro del contenedor:
    # extra_hosts:
    #   - "sapserver.dominio.interno:10.x.x.x"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
